<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram Clone Feed</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="insta-container">
      <header class="top-bar">
        <div class="logo">Instagram</div>
        <div class="top-icons">
          <i class="fa-regular fa-square-plus"></i>
          <i class="fa-regular fa-heart"></i>
          <i class="fa-brands fa-facebook-messenger"></i>
        </div>
      </header>
      <section class="stories-container">
        <!-- Your Story -->
        <div class="story">
          <div class="img-wrapper my-story">
            <img
              src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150"
              alt="me"
            />
            <div class="add-icon">+</div>
          </div>
          <span>Your Story</span>
        </div>
        <!-- Friends Stories -->
        <div class="story">
          <div class="img-wrapper">
            <img
              src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150"
              alt="user"
            />
          </div>
          <span>sarah_j</span>
        </div>
        <div class="story">
          <div class="img-wrapper">
            <img
              src="https://images.unsplash.com/photo-1527980965255-d3b416303d12?w=150"
              alt="user"
            />
          </div>
          <span>mike_dev</span>
        </div>
        <div class="story">
          <div class="img-wrapper">
            <img
              src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150"
              alt="user"
            />
          </div>
          <span>urban_pic</span>
        </div>
        <div class="story">
          <div class="img-wrapper">
            <img
              src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=150"
              alt="user"
            />
          </div>
          <span>nina.sky</span>
        </div>
        <div class="story">
          <div class="img-wrapper">
            <img
              src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150"
              alt="user"
            />
          </div>
          <span>travel_jim</span>
        </div>
        <div class="story">
          <div class="img-wrapper">
            <img
              src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150"
              alt="user"
            />
          </div>
          <span>clara_lens</span>
        </div>
        <div class="story">
          <div class="img-wrapper">
            <img
              src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=150"
              alt="user"
            />
          </div>
          <span>street.style</span>
        </div>
        <div class="story">
          <div class="img-wrapper">
            <img
              src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150"
              alt="user"
            />
          </div>
          <span>art_vibes</span>
        </div>
        <div class="story">
          <div class="img-wrapper">
            <img
              src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=150"
              alt="user"
            />
          </div>
          <span>model_daily</span>
        </div>
      </section>

      <!-- POST 1 -->
      <article class="post">
        <header class="post-header">
          <div class="user-info">
            <img
              src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150"
              alt="profile"
            />
            <span class="username">FH_TOUHID</span>
          </div>
          <i class="fa-solid fa-ellipsis"></i>
        </header>
        <div class="post-content">
          <img
            src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=800"
            alt="post image"
          />
          <i class="fa-solid fa-heart pop-heart"></i>
        </div>
        <footer class="post-footer">
          <div class="action-buttons">
            <div class="left-actions">
              <i class="fa-regular fa-heart like-icon"></i>
              <i class="fa-regular fa-comment"></i>
              <i class="fa-regular fa-paper-plane"></i>
            </div>
            <i class="fa-regular fa-bookmark"></i>
          </div>
          <div class="likes-count">1,234 likes</div>
          <div class="caption">
            <span class="username">FH_TOUHID</span> Exploring the mountains! 🏔️
          </div>
        </footer>
      </article>

      <!-- POST 2 -->
      <article class="post">
        <header class="post-header">
          <div class="user-info">
            <img
              src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150"
              alt="profile"
            />
            <span class="username">sarah_j</span>
          </div>
          <i class="fa-solid fa-ellipsis"></i>
        </header>
        <div class="post-content">
          <img
            src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=800"
            alt="post image"
          />
          <i class="fa-solid fa-heart pop-heart"></i>
        </div>
        <footer class="post-footer">
          <div class="action-buttons">
            <div class="left-actions">
              <i class="fa-regular fa-heart like-icon"></i>
              <i class="fa-regular fa-comment"></i>
              <i class="fa-regular fa-paper-plane"></i>
            </div>
            <i class="fa-regular fa-bookmark"></i>
          </div>
          <div class="likes-count">856 likes</div>
          <div class="caption">
            <span class="username">sarah_j</span> Healthy lunch today! 🥗
            #foodie
          </div>
        </footer>
      </article>

      <!-- POST 3 -->
      <article class="post">
        <header class="post-header">
          <div class="user-info">
            <img
              src="https://images.unsplash.com/photo-1527980965255-d3b416303d12?w=150"
              alt="profile"
            />
            <span class="username">mike_dev</span>
          </div>
          <i class="fa-solid fa-ellipsis"></i>
        </header>
        <div class="post-content">
          <img
            src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=800"
            alt="post image"
          />
          <i class="fa-solid fa-heart pop-heart"></i>
        </div>
        <footer class="post-footer">
          <div class="action-buttons">
            <div class="left-actions">
              <i class="fa-regular fa-heart like-icon"></i>
              <i class="fa-regular fa-comment"></i>
              <i class="fa-regular fa-paper-plane"></i>
            </div>
            <i class="fa-regular fa-bookmark"></i>
          </div>
          <div class="likes-count">2,041 likes</div>
          <div class="caption">
            <span class="username">mike_dev</span> Setup is finally complete
            💻🔥
          </div>
        </footer>
      </article>
    </main>
    <script src="script.js"></script>
  </body>
</html>
