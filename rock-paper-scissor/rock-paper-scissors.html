<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock · Paper · Scissors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <div class="deco deco-1">🪨</div>
    <div class="deco deco-2">✂️</div>
    <div class="deco deco-3">📄</div>

    <div class="page">
      <header>
        <h1 class="game-title">Rock · Paper · Scissors</h1>
        <p class="game-sub">First to 3 stars wins the match</p>
      </header>

      <div class="scoreboard">
        <div class="score-card you">
          <div class="score-label">Your Score</div>
          <div class="score-number">0</div>
          <div class="stars">
            <span class="score-stars" id="star-1-me">⭐</span>
            <span class="score-stars" id="star-2-me">⭐</span>
            <span class="score-stars" id="star-3-me">⭐</span>
          </div>
        </div>
        <div class="vs-badge">VS</div>
        <div class="score-card cpu">
          <div class="score-label">Opponent</div>
          <div class="score-number">0</div>
          <div class="stars">
            <span class="score-stars" id="star-1-cpu">⭐</span>
            <span class="score-stars" id="star-2-cpu">⭐</span>
            <span class="score-stars" id="star-3-cpu">⭐</span>
          </div>
        </div>
      </div>

      <p class="section-label">⚡ Choose your weapon</p>

      <div class="choices">
        <div class="choice-btn rock">
          <span class="choice-emoji">🪨</span>
          <span class="choice-name">Rock</span>
        </div>
        <div class="choice-btn paper">
          <span class="choice-emoji">📄</span>
          <span class="choice-name">Paper</span>
        </div>
        <div class="choice-btn scissors">
          <span class="choice-emoji">✂️</span>
          <span class="choice-name">Scissors</span>
        </div>
      </div>
      <div class="divider"></div>
      <div class="result scoreboard"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
