<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Soft Neon Download Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1 class="title">Song.mp3</h1>

        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>

        <div id="percentage" class="percentage">0%</div>
        <div id="status-label" class="status">Ready to download</div>

        <button id="download-btn" class="button">Download</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
